<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continental Rails</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3d36">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#e3e9ec;--panel:#f7f9fa;--ink:#1c2a33;--muted:#5d6b74;--line:#c3ced4;--accent:#b07a1f;--head:#1f3d36;--map:#d3e0e6;--rim:rgba(0,0,0,.4);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--panel:#1b262d;--ink:#e6edf0;--muted:#94a3ab;--line:#2f3e47;--accent:#e0a640;--head:#173029;--map:#18252c;--rim:rgba(255,255,255,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1f;--panel:#1b262d;--ink:#e6edf0;--muted:#94a3ab;--line:#2f3e47;--accent:#e0a640;--head:#173029;--map:#18252c;--rim:rgba(255,255,255,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h3{font-family:"Zilla Slab",Georgia,serif;margin:0}
h1{font-size:22px;letter-spacing:.01em}
h3{font-size:20px;margin-bottom:6px}
#app{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--head);color:#f1e6cf}
.sp{flex:1}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid rgba(241,230,207,.5);background:transparent;color:#f1e6cf;font:700 16px/1 inherit;cursor:pointer}
.players{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 4px}
.pl{flex:1 0 auto;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel);font-size:12.5px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.pl.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
#status{padding:6px 12px 8px;font-size:13.5px;min-height:3.2em}
#status .last{color:var(--muted);font-size:12.5px;margin-top:2px}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;padding:0;cursor:pointer}
#mapWrap{overflow:auto;background:var(--map);border-block:1px solid var(--line);max-height:56vh}
#map svg{display:block;width:100%;height:auto}
#mapWrap.zoom #map svg{width:190%}
#map text{font-size:8.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
#map [data-r]{cursor:pointer}
#map .city{pointer-events:none}
#map.st .city{pointer-events:auto;cursor:pointer}
#map.st .city.pick circle+circle{stroke:var(--accent);stroke-width:2.4}
.flash line{animation:fl 1.2s ease-out 2}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flash line{animation:none}}
.sec{padding:8px 12px 2px}
.lbl{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{width:50px;height:36px;border-radius:6px;border:1.5px solid rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font:700 13px/1 inherit;cursor:pointer;padding:0}
.card:disabled{opacity:.45;cursor:default}
.deck{background:var(--head);color:#f1e6cf;border-style:dashed;border-color:#f1e6cf}
.loco{background:linear-gradient(135deg,#e53935,#fb8c00,#f6c90e,#43a047,#1e88e5,#9c27b0)!important;color:#fff!important;text-shadow:0 1px 2px #000}
.hand{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.chip{height:34px;border-radius:5px;border:1.5px solid rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.chip.z{opacity:.22}
.bar{display:flex;gap:6px;padding:10px 12px 14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 12px;font:700 14px/1.1 inherit;cursor:pointer}
.bar .btn{flex:1;padding:10px 6px}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.wide{display:block;width:100%;margin-top:8px}
.btn:focus-visible,.card:focus-visible,.lnk:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--panel);border-radius:14px 14px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease-out}
#sheet.open{transform:none}
#sheet p{margin:6px 0}
#sheet .x{float:right;width:36px;height:36px;margin:-4px -6px 4px 8px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px/1 inherit;cursor:pointer}
.opt{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;text-align:left}
.sw{display:inline-block;vertical-align:-3px;width:22px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.3);flex:none}
.tk{display:flex;justify-content:space-between;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.tk.on{border-color:var(--accent);background:var(--panel)}
.tk.ok{border-color:#3f8f55}
.tk b{font-family:"Zilla Slab",Georgia,serif;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
td,th{padding:5px 3px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
.card.pick{opacity:1!important;outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-4px);transition:transform .2s}
.now{border-left:5px solid;padding:7px 10px;background:var(--panel);border-radius:6px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.now .lnk{margin-left:auto;font-size:12.5px}
.final{background:var(--accent);color:#fff;font-weight:700;padding:7px 10px;border-radius:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:90%}
#toast.open{opacity:1}
#tutBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:59;display:none}
#tutBg.open{display:block}
.focus{position:relative;z-index:60;box-shadow:0 0 0 3px var(--accent),0 0 0 100vmax rgba(0,0,0,.55)!important}
#tut{position:fixed;left:10px;right:10px;max-width:540px;margin:0 auto;z-index:70;background:var(--panel);border-radius:12px;padding:14px 16px;display:none;box-shadow:0 6px 30px rgba(0,0,0,.35)}
#tut.open{display:block}
#tut.top{top:calc(12px + env(safe-area-inset-top,0px))}
#tut.bot{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#tut p{margin:4px 0 12px}
#start{position:fixed;inset:0;z-index:80;background:var(--head);color:#f1e6cf;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
#start .box{max-width:380px;width:100%}
#start h1{font-size:40px;line-height:1.05;margin-bottom:10px}
#start p{color:#cdd8d2;margin:0 0 22px}
#start .lbl{color:#cdd8d2}
#start .btn{background:transparent;color:#f1e6cf;border-color:rgba(241,230,207,.45)}
#start .btn.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
#start .btn.pri{background:var(--accent);color:#fff;border-color:transparent}
#opp .btn{width:56px}
.rail{height:6px;margin:18px 0;background:repeating-linear-gradient(90deg,#f1e6cf 0 18px,transparent 18px 26px);opacity:.6;border-radius:3px}
</style>
</head>
<body>
<div id="app">
<header><h1>Continental Rails</h1><span class="sp"></span><button class="ib" id="fsBtn" aria-label="Full screen">⛶</button><button class="ib" id="helpBtn" aria-label="How to play">?</button><button class="ib" id="newBtn" aria-label="New game">↻</button></header>
<div class="players" id="players"></div>
<div id="status"></div>
<div id="mapWrap"><div id="map"></div></div>
<div class="sec"><div class="lbl">Draw from the face-up cards or the deck</div><div class="row" id="market"></div></div>
<div class="sec"><div class="lbl">Your hand</div><div class="hand" id="hand"></div></div>
<div class="bar"><button class="btn" id="tixBtn">Tickets</button><button class="btn" id="stBtn">Station</button><button class="btn" id="hintBtn">Hint</button><button class="btn" id="zoomBtn" aria-label="Zoom map">Zoom</button><button class="btn" id="logBtn">Log</button></div>
</div>
<div id="scrim"></div><div id="sheet"></div><div id="toast"></div>
<div id="tutBg"></div><div id="tut"></div>
<div id="start"><div class="box">
<h1>Continental Rails</h1>
<p>Lay track across Europe against computer rivals. Claim routes, connect your secret destinations, and beat the other railways to the best lines.</p>
<div class="lbl">Opponents</div>
<div class="row" id="opp"><button class="btn" data-n="1">1</button><button class="btn on" data-n="2">2</button><button class="btn" data-n="3">3</button></div>
<div class="rail"></div>
<button class="btn pri wide" id="playT">Play with tutorial</button>
<button class="btn wide" id="play">Play</button>
</div></div>
<script>
const AUTO=typeof window!=='undefined'&&window.__AUTO===true;
const DELAY=AUTO?0:800;
const $=id=>document.getElementById(id);
const COL={R:'#e53935',B:'#1e88e5',G:'#43a047',Y:'#f6c90e',K:'#353535',W:'#f4f4f4',O:'#fb8c00',P:'#d63384',X:'#a39c92'};
const NAME={R:'Red',B:'Blue',G:'Green',Y:'Yellow',K:'Black',W:'White',O:'Orange',P:'Pink',L:'Loco',X:'Grey'};
const CC=['R','B','G','Y','K','W','O','P'];
const PTS={1:1,2:2,3:4,4:7,5:10,6:15};
const CITIES={Edinburgh:[62,38],London:[78,108],Amsterdam:[138,100],Brussels:[122,134],Paris:[108,172],Brest:[38,160],Bordeaux:[72,242],Madrid:[48,322],Barcelona:[118,304],Lisbon:[14,352],Marseille:[152,270],Zurich:[172,206],Frankfurt:[176,140],Munich:[218,182],Berlin:[244,98],Copenhagen:[214,44],Stockholm:[292,14],Riga:[338,44],Warsaw:[308,110],Kyiv:[376,120],Vienna:[264,196],Budapest:[304,216],Venice:[222,240],Rome:[226,302],Palermo:[240,372],Bucharest:[352,262],Sofia:[326,312],Athens:[314,384],Istanbul:[384,334]};
const ROUTES=`Edinburgh London 3 O|Edinburgh Copenhagen 4 X F1|London Amsterdam 2 X F1|London Paris 2 X F1|Amsterdam Brussels 1 K|Amsterdam Frankfurt 2 W|Amsterdam Berlin 3 Y|Copenhagen Berlin 2 X F1|Brussels Paris 2 Y|Brussels Frankfurt 2 B|Paris Brest 3 O|Paris Bordeaux 3 P|Brest Bordeaux 3 K|Paris Frankfurt 3 W|Paris Zurich 3 X T|Paris Marseille 4 R|Bordeaux Madrid 3 X T|Marseille Barcelona 4 X|Madrid Lisbon 2 P|Madrid Barcelona 2 Y|Lisbon Brest 6 X F2|Marseille Zurich 2 P T|Marseille Rome 3 X T|Zurich Frankfurt 2 O|Zurich Munich 2 Y T|Zurich Venice 2 G T|Frankfurt Munich 2 P|Frankfurt Berlin 3 K|Munich Vienna 2 O|Munich Venice 2 B T|Berlin Warsaw 3 P|Berlin Vienna 3 G|Copenhagen Stockholm 3 Y|Stockholm Riga 2 X F1|Riga Warsaw 3 R|Riga Kyiv 3 B|Warsaw Kyiv 2 X|Warsaw Vienna 3 B|Warsaw Budapest 3 X T|Vienna Budapest 1 R|Vienna Venice 2 K|Kyiv Bucharest 4 W|Budapest Bucharest 3 O T|Budapest Sofia 4 R|Venice Rome 2 W|Rome Palermo 3 K|Palermo Athens 4 X F2|Bucharest Sofia 2 X|Bucharest Istanbul 3 G|Sofia Istanbul 2 B|Sofia Athens 3 P|Athens Istanbul 3 X F1`.split('|').map((s,id)=>{const[a,b,l,c,x]=s.split(' ');return{id,a,b,len:+l,c,t:x==='T',f:x&&x[0]==='F'?+x[1]:0,owner:-1}});
const PCOL=['#00a3b4','#8e3fb8','#7a4a2c','#4b5d6b'];
const BOTS=['Ada','Brunel','Cugnot'];
const TUT=[
[null,'Welcome aboard','Connect cities across Europe with your trains. You score for every route you claim and for each secret destination ticket you complete. The highest score wins.'],
['mapWrap','The map','Each route needs matching cards: one card per segment, in the route’s colour. Grey routes take any single colour. Use Zoom if the map feels small.'],
['market','Draw cards','On your turn you can take 2 cards, from the 5 face-up cards or blind from the deck. Rainbow Locos are wild, but taking a face-up Loco uses your whole draw.'],
['hand','Your hand','Your cards are counted here by colour. Locos can stand in for any colour.'],
['mapWrap','Claim a route','Instead of drawing, tap a route and pay for it. You score at once: 1, 2, 4, 7, 10 or 15 points for lengths 1 to 6.'],
['tixBtn','Destination tickets','Your secret goals. Link both cities with your own trains to earn the ticket’s points. Unfinished tickets are subtracted at the end. Taking new tickets uses your turn.'],
['mapWrap','Tunnels and ferries','Routes with a thick dark border are tunnels: 3 cards are revealed and each match costs one more card. White dots mark ferries: pay that many Locos.'],
['stBtn','Stations','Blocked? Build a station in any free city: it costs 1, then 2, then 3 cards. At the end it lets you use one rival route from that city for your tickets. Each unused station is worth 4 points.'],
['hintBtn','Need help?','Tap Hint any time. It lights up the routes your tickets still need and tells you what to do next.'],
['players','The last turns','When someone has 2 or fewer trains left, everyone gets one final turn. Then tickets are scored and the longest continuous line earns 10 bonus points. Good luck!']];

let G,ADJ,SH=null,NB=2,FAST=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const me=()=>G.players[0],cur=()=>G.players[G.turn];
const myTurn=()=>G&&!G.over&&!G.busy&&G.turn===0&&!G.players[0].isBot;
const hc=p=>Object.values(p.hand).reduce((a,b)=>a+b,0);
const cost=pa=>pa.reduce((s,r)=>s+r.len,0);
function buildAdj(){ADJ={};for(const c in CITIES)ADJ[c]=[];for(const r of G.routes){ADJ[r.a].push(r);ADJ[r.b].push(r)}}
function path(pi,a,b,ex=[]){const D={},P={},Q=new Set(Object.keys(CITIES));for(const c of Q)D[c]=1e9;D[a]=0;
 while(Q.size){let u=null;for(const c of Q)if(u===null||D[c]<D[u])u=c;if(D[u]>=1e9||u===b)break;Q.delete(u);
  for(const r of ADJ[u]){const bw=ex.includes(r);if(r.owner>=0&&r.owner!==pi&&!bw)continue;const v=r.a===u?r.b:r.a,w=D[u]+(r.owner===pi||bw?0:r.len);if(w<D[v]){D[v]=w;P[v]=r}}}
 if(D[b]>=1e9)return null;const out=[];for(let c=b;c!==a;){const r=P[c];if(r.owner<0)out.push(r);c=r.a===c?r.b:r.a}return out}
function conn(pi,a,b,ex=[]){const par={};const f=x=>{while(par[x]&&par[x]!==x)x=par[x];return x};
 for(const r of G.routes)if(r.owner===pi||ex.includes(r)){const x=f(r.a),y=f(r.b);if(x!==y)par[x]=y}return f(a)===f(b)}
function longest(pi){const es=G.routes.filter(r=>r.owner===pi),used=new Set();let best=0;
 const dfs=(c,l)=>{if(l>best)best=l;for(const e of es)if(!used.has(e)&&(e.a===c||e.b===c)){used.add(e);dfs(e.a===c?e.b:e.a,l+e.len);used.delete(e)}};
 for(const c in CITIES)dfs(c,0);return best}
// all ticket candidates
G={routes:ROUTES};buildAdj();
const PAIRS=[];{const n=Object.keys(CITIES);for(let i=0;i<n.length;i++)for(let j=i+1;j<n.length;j++){const v=cost(path(-9,n[i],n[j]));if(v>=5&&v<=12)PAIRS.push({a:n[i],b:n[j],v})}}
G=null;

function drawCard(){if(!G.deck.length&&G.disc.length){G.deck=shuffle(G.disc);G.disc=[]}return G.deck.pop()||null}
function refill(){for(let k=0;k<4;k++){while(G.face.length<5){const c=drawCard();if(!c)break;G.face.push(c)}
 if(k<3&&G.face.filter(c=>c==='L').length>=3){G.disc.push(...G.face);G.face=[]}else break}}
function takeFace(pi,i){const c=G.face.splice(i,1)[0];G.players[pi].hand[c]++;refill();return c}
function takeDeck(pi){const c=drawCard();if(c)G.players[pi].hand[c]++;return c}
function canSpend(p,c,n,minL=0){const h=p.hand;return h.L>=minL&&(c==='L'?0:h[c])+h.L>=n}
function spend(p,c,n,minL=0){const h=p.hand,s=[];const take=(k,x)=>{h[k]-=x;for(let i=0;i<x;i++)s.push(k)};
 take('L',minL);n-=minL;if(c!=='L'){const x=Math.min(h[c],n);take(c,x);n-=x}take('L',n);G.disc.push(...s)}
function payOpts(p,r){if(p.trains<r.len)return[];const o=(r.c==='X'?CC:[r.c]).filter(c=>p.hand[c]>0&&canSpend(p,c,r.len,r.f));if(p.hand.L>=r.len&&!o.length)o.push('L');else if(p.hand.L>=r.len)o.push('L');return o}
function payLabel(p,r,c){if(c==='L')return`${r.len} Loco${r.len>1?'s':''}`;const l=Math.max(r.f,r.len-p.hand[c]);return`${r.len-l} ${NAME[c]}${l?` + ${l} Loco${l>1?'s':''}`:''}`}
function reveal(c){const cards=[];for(let i=0;i<3;i++){const x=drawCard();if(x)cards.push(x)}G.disc.push(...cards);return{cards,extra:cards.filter(x=>x==='L'||x===c).length}}
function claim(pi,r,c,n){const p=G.players[pi];spend(p,c,n,r.f);r.owner=pi;p.trains-=r.len;p.score+=PTS[r.len];G.didAct=true;G.last=r.id;
 log(`${pi?p.name:'You'} claimed ${r.a}–${r.b} (+${PTS[r.len]}).`)}
function log(m){G.log.unshift(m);if(G.log.length>60)G.log.pop()}

function newGame(nb){const n=nb+1,tr={2:30,3:27,4:24}[n];
 G={routes:ROUTES.map(r=>({...r,owner:-1})),deck:[],disc:[],face:[],tdeck:shuffle(PAIRS.map(t=>({...t}))).slice(0,44),turn:0,draws:0,finalLeft:-1,passes:0,didAct:false,over:false,busy:false,log:[],recap:[],say:null,pick:null,sel:-1,hl:null,mode:null,last:-1,
  players:Array.from({length:n},(_,i)=>({name:i?BOTS[i-1]:'You',isBot:i>0||AUTO,color:PCOL[i],hand:Object.fromEntries([...CC,'L'].map(c=>[c,0])),tickets:[],trains:tr,stations:[],score:0}))};
 buildAdj();for(const c of CC)for(let i=0;i<12;i++)G.deck.push(c);for(let i=0;i<14;i++)G.deck.push('L');shuffle(G.deck);
 for(const p of G.players)for(let i=0;i<4;i++)p.hand[drawCard()]++;
 refill();
 G.players.forEach((p,i)=>{const l=G.tdeck.splice(0,3);if(p.isBot)botTickets(i,l,2);else p.start=l});
 log('New game. You go first.');
 if(AUTO)setTimeout(()=>botTurn(0),0);
}
function endTurn(){if(G.over)return;const n=G.players.length,p=cur();G.passes=G.didAct?0:G.passes+1;
 if(G.finalLeft>0){if(--G.finalLeft===0)return gameOver()}
 else if(p.trains<=2){G.finalLeft=n;log(`${G.turn?p.name+' is':'You are'} down to ${p.trains} trains. Everyone gets one last turn!`);finalPopup(p)}
 if(G.passes>=n*2)return gameOver();
 if(G.turn===0)G.recap=[];G.turn=(G.turn+1)%n;G.draws=0;G.hint=null;G.say=null;G.pick=null;G.didAct=false;G.mode=null;render();
 if(cur().isBot)setTimeout(()=>botTurn(G.turn),DELAY)}

// ---- bots
function botTickets(pi,list,min){const p=G.players[pi];const sc=list.map(t=>{const pa=path(pi,t.a,t.b);return{t,c:pa?cost(pa):999}}).sort((a,b)=>a.c-b.c);
 let budget=p.trains-4;const keep=[];for(const s of sc){if(keep.length<min||s.c<=budget){keep.push(s.t);budget-=s.c}else G.tdeck.push(s.t)}
 p.tickets.push(...keep);G.didAct=true;if(G.log)log(`${p.name} kept ${keep.length} ticket${keep.length>1?'s':''}.`)}
function pickOpt(p,r,o){return o.slice().sort((a,b)=>(a==='L'?99:Math.max(r.f,r.len-p.hand[a]))-(b==='L'?99:Math.max(r.f,r.len-p.hand[b]))||p.hand[b]-p.hand[a])[0]}
const sleep=ms=>new Promise(r=>setTimeout(r,AUTO?0:ms*(FAST?.35:1)));
function say(m){G.say=m;render()}
async function botTurn(pi){if(!G||G.over||G.turn!==pi)return;const g=G,p=G.players[pi],ok=()=>G===g&&!G.over;G.didAct=false;G.last=-1;
 say(`${p.name} is thinking…`);await sleep(800);if(!ok())return;
 const exS=G.routes.filter(r=>r.owner>=0&&r.owner!==pi&&p.stations.some(s=>r.a===s||r.b===s));
 const need=[],blocked=[];for(const t of p.tickets){if(conn(pi,t.a,t.b,exS))continue;const pa=path(pi,t.a,t.b,exS);if(!pa){blocked.push(t);continue}if(cost(pa)<=p.trains)for(const r of pa)if(!need.includes(r))need.push(r)}
 const note=m=>{log(m);G.recap.push(m)};
 if(blocked.length&&p.stations.length<3){const k=p.stations.length+1,col=[...CC,'L'].filter(c=>c==='L'?p.hand.L>=k:p.hand[c]>0&&canSpend(p,c,k)).sort((a,b)=>(a==='L')-(b==='L')||p.hand[b]-p.hand[a])[0];
  if(col){let best=null;for(const t of blocked.filter(t=>t.v>4).sort((a,b)=>b.v-a.v)){for(const c in CITIES){if(G.players.some(q=>q.stations.includes(c)))continue;for(const r of ADJ[c]){if(r.owner<0||r.owner===pi)continue;const pa=path(pi,t.a,t.b,[...exS,r]);if(pa){const v=cost(pa);if(v<=p.trains&&(!best||v<best.v))best={c,v}}}}if(best)break}
   if(best){const hl=G.hl;G.hl=[best.c];say(`${p.name} is building a station in ${best.c}…`);await sleep(1500);if(!ok())return;G.hl=hl;spend(p,col,k);p.stations.push(best.c);G.didAct=true;note(`${p.name} built a station in ${best.c}.`);say(G.log[0]);await sleep(1400);return ok()&&endTurn()}}}
 const tryClaim=async list=>{for(const r of list.filter(r=>r.owner<0&&r.len<=p.trains).sort((x,y)=>y.len-x.len)){const o=payOpts(p,r);if(!o.length)continue;const c=pickOpt(p,r,o);
   G.sel=r.id;say(`${p.name} is building ${r.a} – ${r.b}${r.t?' (a tunnel)':''}…`);await sleep(1400);if(!ok())return true;G.sel=-1;
   if(r.t){const{cards,extra}=reveal(c);say(`Tunnel check: revealed ${cards.map(x=>NAME[x]).join(', ')||'nothing'}. ${extra?extra+' extra card'+(extra>1?'s':'')+' needed.':'No extra cost.'}`);await sleep(1800);if(!ok())return true;
    if(!canSpend(p,c,r.len+extra,r.f)){note(`${p.name} tried the ${r.a}–${r.b} tunnel and backed out.`);G.didAct=true;say(G.log[0]);await sleep(1200);return true}claim(pi,r,c,r.len+extra)}
   else claim(pi,r,c,r.len);
   G.recap.push(G.log[0]);say(G.log[0]);await sleep(1500);return true}return false};
 if(await tryClaim(need))return ok()&&endTurn();
 if(!need.length&&p.trains>=12&&G.tdeck.length){say(`${p.name} is taking new destination tickets…`);await sleep(1400);if(!ok())return;botTickets(pi,G.tdeck.splice(0,3),1);G.recap.push(G.log[0]);say(G.log[0]);await sleep(1000);return ok()&&endTurn()}
 if((!need.length||p.trains<=6)&&await tryClaim(G.routes.filter(r=>r.len>=(p.trains<=6||!G.tdeck.length?1:3))))return ok()&&endTurn();
 if(!ok())return;
 const want=new Set(need.filter(r=>r.c!=='X').map(r=>r.c));if(need.some(r=>r.c==='X')||!want.size)want.add(CC.slice().sort((a,b)=>p.hand[b]-p.hand[a])[0]);
 const got=[];for(let k=0;k<2;k++){let i=G.face.findIndex(c=>want.has(c));if(i<0&&k===0&&need.some(r=>r.f))i=G.face.indexOf('L');
  if(i<0&&!(G.deck.length+G.disc.length))break;
  G.pick=i>=0?i:'d';say(i>=0?`${p.name} takes the face-up ${NAME[G.face[i]]} card…`:`${p.name} draws a card from the deck…`);await sleep(1100);if(!ok())return;G.pick=null;
  let c;if(i>=0){c=takeFace(pi,i);got.push(NAME[c])}else{c=takeDeck(pi);if(!c)break;got.push('a deck card')}G.didAct=true;render();if(i>=0&&c==='L')break}
 note(got.length?`${p.name} took ${got.join(' + ')}.`:`${p.name} couldn’t do anything and passed.`);say(G.log[0]);await sleep(1000);if(ok())endTurn()}
function finalPopup(p){if(AUTO)return;const you=p===me();
 sheet(`<h3>Final round!</h3><p>${you?'You have':p.name+' has'} only ${p.trains} train${p.trains===1?'':'s'} left.</p><p>Everyone${you?'':', including you,'} now gets <b>exactly one more turn</b>. Then the game ends and the tickets are scored.</p><p class="muted small">Tip: use your last turn to finish a ticket, or build the longest route you can afford.</p>`)}

// ---- scoring
function bestTickets(pi){const p=G.players[pi];let combos=[[]];
 for(const s of p.stations){const o=[null,...G.routes.filter(r=>r.owner>=0&&r.owner!==pi&&(r.a===s||r.b===s))];const nx=[];for(const c of combos)for(const x of o)nx.push([...c,x]);combos=nx}
 let best=null;for(const c of combos){const ex=c.filter(Boolean);let sum=0,done=0;const st=p.tickets.map(t=>{const ok=conn(pi,t.a,t.b,ex);sum+=ok?t.v:-t.v;if(ok)done++;return ok});if(!best||sum>best.sum)best={sum,done,st}}return best}
function gameOver(){G.over=true;const rs=G.players.map((p,i)=>({i,p,t:bestTickets(i),lr:longest(i)}));const mx=Math.max(...rs.map(r=>r.lr));
 rs.forEach(r=>{r.lb=mx>0&&r.lr===mx?10:0;r.st=(3-r.p.stations.length)*4;r.tot=r.p.score+r.t.sum+r.lb+r.st});
 rs.sort((a,b)=>b.tot-a.tot||b.t.done-a.t.done||b.lr-a.lr);
 if(AUTO){console.log(JSON.stringify(rs.map(r=>[r.p.name,r.p.score,r.t.sum,r.lb,r.st,r.tot,r.p.trains,r.p.tickets.length])),G.log.length);return}
 render();const m=rs.find(r=>r.i===0);
 sheet(`<h3>${rs[0].i===0?'You win!':rs[0].p.name+' wins'}</h3><table><tr><th></th><th>Routes</th><th>Tickets</th><th>Longest</th><th>Stations</th><th>Total</th></tr>${rs.map(r=>`<tr><td><span class="dot" style="display:inline-block;background:${r.p.color}"></span> ${r.p.name}</td><td>${r.p.score}</td><td>${r.t.sum}</td><td>${r.lb}</td><td>${r.st}</td><td><b>${r.tot}</b></td></tr>`).join('')}</table>
 <p class="small">Your tickets: ${me().tickets.map((t,k)=>`${m.t.st[k]?'✓':'✗'} ${t.a}–${t.b} (${t.v})`).join(', ')}</p>
 <button class="btn pri wide" data-a="new">Play again</button>`,a=>{closeSheet();if(a==='new')showStart()},null,false)}

function svg(){let s='<svg viewBox="-14 -8 428 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rail map of Europe">';
 for(const r of G.routes){const[x1,y1]=CITIES[r.a],[x2,y2]=CITIES[r.b],d=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/d,uy=(y2-y1)/d,o=7.5,ax=x1+ux*o,ay=y1+uy*o,seg=(d-2*o)/r.len;
  const L=`x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${(x2-ux*o).toFixed(1)}" y2="${(y2-uy*o).toFixed(1)}"`,da=`stroke-dasharray="${(seg-2).toFixed(1)} 2"`,own=r.owner>=0;
  let g=`<g data-r="${r.id}"${G.last===r.id?' class="flash"':''}>`;
  if(!own&&G.hint&&G.hint.includes(r.id))g+=`<line ${L} stroke="var(--accent)" stroke-width="13" stroke-linecap="round" opacity=".45"/>`;
  if(G.sel===r.id)g+=`<line ${L} stroke="var(--accent)" stroke-width="15" stroke-linecap="round" opacity=".55"/>`;
  g+=`<line ${L} stroke="${r.t&&!own?'var(--ink)':'var(--rim)'}" stroke-width="${r.t&&!own?10.5:8}" ${da}/><line ${L} stroke="${own?G.players[r.owner].color:COL[r.c]}" stroke-width="${own?7:6}" ${da}/>`;
  if(!own)for(let i=0;i<r.f;i++)g+=`<circle cx="${(ax+ux*seg*(i+.5)).toFixed(1)}" cy="${(ay+uy*seg*(i+.5)).toFixed(1)}" r="2.1" fill="#fff" stroke="#000" stroke-width=".6"/>`;
  s+=g+`<line ${L} stroke="transparent" stroke-width="16"/></g>`}
 for(const n in CITIES){const[x,y]=CITIES[n],st=G.players.find(p=>p.stations.includes(n)),hl=G.hl&&G.hl.includes(n);
  s+=`<g data-c="${n}" class="city${st?'':' pick'}"><circle cx="${x}" cy="${y}" r="12" fill="transparent"/><circle cx="${x}" cy="${y}" r="${hl?6:4.3}" fill="${hl?'var(--accent)':'var(--panel)'}" stroke="var(--ink)" stroke-width="1.4"/>${st?`<path d="M${x-4.5} ${y+12}h9v-5.5l-4.5-4-4.5 4z" fill="${st.color}" stroke="#fff" stroke-width=".9"/>`:''}<text x="${x}" y="${y-8}" text-anchor="middle">${n}</text></g>`}
 return s+'</svg>'}

 $('players').innerHTML=G.players.map((p,i)=>`<div class="pl${i===G.turn&&!G.over?' on':''}"><span class="dot" style="background:${p.color}"></span><b>${p.name}</b> ${p.score} pts, ${p.trains} trains, ${hc(p)} cards</div>`).join('');

 else if(G.mode==='station')s='Tap a city to build your station. <button class="lnk" data-a="cancelSt">Cancel</button>';
 else if(G.draws)s='Take one more card (not a face-up Loco).';else s='Your turn: draw 2 cards, tap a route to claim it, take tickets, or build a station.';

 if(G.pick!=null){const b=$('market').querySelector(`[data-f="${G.pick}"]`);if(b)b.classList.add('pick')}
 const h=me().hand;$('hand').innerHTML=[...CC,'L'].map(c=>`<div class="chip${c==='L'?' loco':''}${h[c]?'':' z'}" style="background:${COL[c]||''};color:${fg(c)}" title="${NAME[c]}">${h[c]}</div>`).join('');
 const t=me().tickets;$('tixBtn').textContent=`Tickets ${t.filter(x=>conn(0,x.a,x.b)).length}/${t.length}`;

function chooseTickets(list,min,done){const pick=new Set(list.map((_,i)=>i));
 const draw=()=>sheet(`<h3>Choose destination tickets</h3><p class="muted">Keep at least ${min}. Connect both cities to earn the points; unfinished tickets are subtracted at the end.</p>${list.map((t,i)=>`<button class="tk${pick.has(i)?' on':''}" data-a="t" data-i="${i}"><span>${pick.has(i)?'☑':'☐'} ${t.a} → ${t.b}</span><b>${t.v}</b></button>`).join('')}<button class="btn pri wide" data-a="ok" ${pick.size<min?'disabled':''}>Keep ${pick.size} ticket${pick.size===1?'':'s'}</button>`,
  (a,el)=>{if(a==='t'){const i=+el.dataset.i;pick.has(i)?pick.delete(i):pick.add(i);G.hl=[list[i].a,list[i].b];render();draw()}
   else if(a==='ok'&&pick.size>=min){closeSheet();const keep=list.filter((_,i)=>pick.has(i));me().tickets.push(...keep);G.tdeck.push(...list.filter((_,i)=>!pick.has(i)));G.hl=null;done(keep)}},null,true);draw()}
function askStart(){G.busy=true;render();chooseTickets(me().start,2,()=>{G.busy=false;log('You kept your tickets. Your move!');render()})}
function showStart(){closeTut();$('start').style.display='flex'}
function begin(t){$('start').style.display='none';newGame(NB);render();if(t)tutorial(askStart);else askStart()}

function onRoute(id){const r=G.routes[id],p=me();G.sel=id;render();
 let h=`<h3>${r.a} – ${r.b}</h3><p class="muted">${r.len} × ${r.c==='X'?'any one colour':NAME[r.c]}, worth ${PTS[r.len]} point${PTS[r.len]>1?'s':''}.${r.t?' Tunnel.':''}${r.f?` Ferry: needs ${r.f} Loco${r.f>1?'s':''}.`:''}</p>`;
 if(r.owner>=0)h+=`<p>Already claimed by ${r.owner?G.players[r.owner].name:'you'}.</p>`;
 else if(!myTurn())h+='<p>Wait for your turn.</p>';
 else if(G.draws)h+='<p>Take your second card first.</p>';
 else if(p.trains<r.len)h+=`<p>You only have ${p.trains} trains left.</p>`;
 else{const o=payOpts(p,r);h+=o.length?o.map(c=>`<button class="btn opt" data-a="pay" data-c="${c}">${swatch(c)} Pay ${payLabel(p,r,c)}</button>`).join(''):'<p>You can’t afford this route yet. Draw more matching cards.</p>';
  if(r.t&&o.length)h+='<p class="muted small">After you pay, 3 cards are revealed. Each one matching your colour (or a Loco) costs one more card. You can back out, but your turn ends.</p>'}
 sheet(h,(a,el)=>{if(a==='pay')humanClaim(r,el.dataset.c)},()=>{G.sel=-1;render()})}
function humanClaim(r,c){closeSheet();const p=me();G.didAct=true;
 if(!r.t){claim(0,r,c,r.len);return endTurn()}
 const{cards,extra}=reveal(c),ok=canSpend(p,c,r.len+extra,r.f);
 sheet(`<h3>Tunnel ${r.a} – ${r.b}</h3><p class="muted">Revealed from the deck:</p><div class="row">${cards.map(x=>cardEl(x,'disabled style="opacity:1"')).join('')}</div><p>${extra?`You need ${extra} more ${c==='L'?'Loco':NAME[c]+' or Loco'} card${extra>1?'s':''}.`:'No extra cards needed.'}</p>${ok?`<button class="btn pri wide" data-a="go">${extra?'Pay the extra and build':'Build it'}</button>`:'<p>You can’t cover the extra cost.</p>'}<button class="btn wide" data-a="no">Back out (ends your turn)</button>`,
  a=>{closeSheet();if(a==='go'&&ok)claim(0,r,c,r.len+extra);else log('You backed out of a tunnel.');endTurn()},null,true)}
function onCity(n){if(G.players.some(p=>p.stations.includes(n)))return toast('That city already has a station.');
 const p=me(),k=p.stations.length+1,o=CC.filter(c=>p.hand[c]>0&&canSpend(p,c,k));if(p.hand.L>=k)o.push('L');
 sheet(`<h3>Station in ${n}</h3><p class="muted">Costs ${k} card${k>1?'s':''} of one colour. Locos are wild.</p>${o.length?o.map(c=>`<button class="btn opt" data-a="b" data-c="${c}">${swatch(c)} Pay ${c==='L'?k+' Loco'+(k>1?'s':''):(()=>{const l=Math.max(0,k-p.hand[c]);return`${k-l} ${NAME[c]}${l?` + ${l} Loco`:''}`})()}</button>`).join(''):'<p>You don’t have enough matching cards.</p>'}`,
  (a,el)=>{closeSheet();spend(p,el.dataset.c,k);p.stations.push(n);G.didAct=true;log(`You built a station in ${n}.`);endTurn()})}
function showTickets(){const p=me(),can=myTurn()&&!G.draws&&!G.mode&&G.tdeck.length;
 sheet(`<h3>Your tickets</h3>${p.tickets.map(t=>{const ok=conn(0,t.a,t.b),on=G.hl&&G.hl[0]===t.a&&G.hl[1]===t.b;return`<button class="tk${ok?' ok':''}${on?' on':''}" data-a="hl" data-x="${t.a}|${t.b}"><span>${ok?'✓ ':''}${t.a} → ${t.b}</span><b>${t.v}</b></button>`}).join('')||'<p>No tickets yet.</p>'}<p class="muted small">Tap a ticket to mark its cities on the map. Stations only count at the end.</p>${can?'<button class="btn pri wide" data-a="draw">Draw 3 new tickets (uses your turn)</button>':''}`,

function showHint(){if(!G||G.busy||G.over)return;const p=me(),need=[],bad=[];
 for(const t of p.tickets){if(conn(0,t.a,t.b))continue;const pa=path(0,t.a,t.b);if(!pa){bad.push(t);continue}for(const r of pa)if(!need.includes(r))need.push(r)}

  h+=`<p><b>What to do now:</b> ${now.length&&myTurn()&&!G.draws?`build a route marked ✓, for example ${now[0].a} – ${now[0].b}.`:cols.length?`collect ${cols.join(', ')} cards, or rainbow Locos.`:'wait for your turn.'}</p>`;
  if(bad.length)h+=`<p class="small">Blocked: ${bad.map(t=>t.a+' → '+t.b).join(', ')}. A station in a city next to the blocking route can rescue it.</p>`}

 $('fsBtn').onclick=()=>{const d=document;if(d.fullscreenElement)return d.exitFullscreen();d.documentElement.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}}).catch(()=>toast('Full screen isn’t available here. Try the downloaded file.'))};
 if(!document.documentElement.requestFullscreen||matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)$('fsBtn').hidden=true;
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 $('newBtn').onclick=()=>{if(!G||G.over||confirm('Start a new game?')){closeSheet();showStart()}};
 $('sheet').onclick=e=>{if(e.target.closest('[data-close]'))return closeSheet();const b=e.target.closest('[data-a]');if(b&&SH&&SH.onAct&&!b.disabled)SH.onAct(b.dataset.a,b)};
 $('scrim').onclick=()=>{if(SH&&!SH.lock)closeSheet()};
 $('map').onclick=e=>{if(!G)return;const c=e.target.closest('[data-c]');if(c&&G.mode==='station'&&myTurn())return onCity(c.dataset.c);const r=e.target.closest('[data-r]');if(r&&G.mode!=='station')onRoute(+r.dataset.r)};
 $('market').onclick=e=>{const b=e.target.closest('[data-f]');if(!b||b.disabled||!myTurn())return;let c;
  if(b.dataset.f==='d'){c=takeDeck(0);if(!c)return;toast(`You drew ${NAME[c]}.`)}else{const i=+b.dataset.f;if(G.face[i]==='L'&&G.draws)return;c=takeFace(0,i)}
  G.draws++;G.didAct=true;
  if((b.dataset.f!=='d'&&c==='L')||G.draws>=2||!(G.deck.length+G.disc.length||G.face.some(x=>x!=='L'))){log(`You took ${G.draws} card${G.draws>1?'s':''}.`);endTurn()}else render()};
 $('status').onclick=e=>{if(e.target.closest('[data-a="cancelSt"]')){G.mode=null;render()}if(e.target.closest('[data-a="fast"]')){FAST=!FAST;render()}};
 $('tixBtn').onclick=()=>{if(G&&!G.busy)showTickets()};
 $('hintBtn').onclick=showHint;
 $('stBtn').onclick=()=>{if(!myTurn())return;G.mode=G.mode==='station'?null:'station';if(G.mode&&!$('mapWrap').classList.contains('zoom'))toast('Tap a city on the map.');render()};
 $('zoomBtn').onclick=()=>{$('mapWrap').classList.toggle('zoom');$('zoomBtn').classList.toggle('on')};
 $('logBtn').onclick=()=>{if(G)sheet(`<h3>Game log</h3>${G.log.map(l=>`<p class="small">${l}</p>`).join('')}`)};
}else newGame(window.__NB||2);
</script>
</body>
</html>
