<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continental Rails</title>
<meta name="description" content="A railway board game across Europe against computer rivals.">
<meta name="theme-color" content="#2b211a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#2b211a;--ink:#f1e3c4;--muted:#d8c8a6;--gold:#c9952e;--accent:#a3361f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 30% 30%,#3a2c20,#17110c);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{max-width:520px;width:100%;border:2px solid var(--gold);border-radius:14px;padding:30px 28px;background:rgba(0,0,0,.25)}
h1{font:700 44px/1.05 "Zilla Slab",Georgia,serif;margin:0 0 10px;letter-spacing:.03em}
p{color:var(--muted);margin:0 0 20px}
.rail{height:6px;margin:20px 0;background:repeating-linear-gradient(90deg,#f1e3c4 0 18px,transparent 18px 26px);opacity:.5;border-radius:3px}
a.ed{display:block;text-decoration:none;color:var(--ink);border:1px solid rgba(241,227,196,.45);border-radius:10px;padding:14px 16px;margin-top:10px}
a.ed:hover,a.ed:focus-visible{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold);outline:none}
a.ed b{display:block;font:700 20px "Zilla Slab",Georgia,serif}
a.ed span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="box">
<h1>Continental Rails</h1>
<p>Lay track across Europe against computer rivals. Claim routes, connect your secret destinations, and beat the other railways to the best lines.</p>
<div class="rail"></div>
<a class="ed" href="phone/"><b>Phone edition</b><span>Upright phone, compact map with zoom. 29 cities.</span></a>
<a class="ed" href="pc/"><b>PC edition</b><span>Desktop or phone held sideways, board-game look. 29 cities.</span></a>
</main>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
