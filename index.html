<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continental Rails</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3d36">
<meta name="description" content="A railway board game across Europe against computer rivals.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#e3e9ec;--panel:#f7f9fa;--ink:#1c2a33;--muted:#5d6b74;--line:#c3ced4;--accent:#b07a1f;--head:#1f3d36;--map:#b9d2dc;--land:#f4f0e4;--coast:#8fa6b0;--bord:rgba(90,75,50,.38);--rim:rgba(0,0,0,.4);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--panel:#1b262d;--ink:#e6edf0;--muted:#94a3ab;--line:#2f3e47;--accent:#e0a640;--head:#173029;--map:#0e1b21;--land:#22313a;--coast:#3f5762;--bord:rgba(255,255,255,.2);--rim:rgba(255,255,255,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1f;--panel:#1b262d;--ink:#e6edf0;--muted:#94a3ab;--line:#2f3e47;--accent:#e0a640;--head:#173029;--map:#0e1b21;--land:#22313a;--coast:#3f5762;--bord:rgba(255,255,255,.2);--rim:rgba(255,255,255,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h3{font-family:"Zilla Slab",Georgia,serif;margin:0}
h1{font-size:22px;letter-spacing:.01em}
h3{font-size:20px;margin-bottom:6px}
#app{margin:0 auto;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--head);color:#f1e6cf;flex:none}
.sp{flex:1}
.ib{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(241,230,207,.5);background:transparent;color:#f1e6cf;font:700 16px/1 inherit;cursor:pointer}
.players{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none}
.pl{flex:1 0 auto;border:1px solid rgba(241,230,207,.28);border-radius:8px;padding:4px 7px;background:rgba(255,255,255,.07);font-size:12.5px;display:flex;gap:5px;align-items:center;justify-content:center;white-space:nowrap}
.pl .tr{display:inline-flex;align-items:center;gap:2px;opacity:.8;font-size:11.5px}
.pl.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent);background:rgba(255,255,255,.14)}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
#ticker{flex:none;display:flex;align-items:stretch;height:30px;background:var(--head);color:#f1e6cf;font-size:13px;cursor:pointer;overflow:hidden}
#ticker .tag{flex:none;display:flex;align-items:center;padding:0 9px;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
#ticker .trk{flex:1;min-width:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 6px,#000 calc(100% - 14px),transparent)}
#ticker .trk>span{display:inline-block;padding-left:9px}
#ticker .trk.run>span{animation:tick var(--t,20s) linear 1.2s infinite}
@keyframes tick{to{transform:translateX(-50%)}}
#ticker .gap{display:inline-block;width:48px;text-align:center;opacity:.55}
#ticker .tb{flex:none;background:rgba(255,255,255,.1);border:0;border-left:1px solid rgba(241,230,207,.2);color:#f1e6cf;font:700 12px/1 inherit;padding:0 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#ticker .trk.run>span{animation:none}}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;padding:0;cursor:pointer}
#mapWrap{flex:1;min-height:0;overflow:auto;background:var(--map);overscroll-behavior:contain}
#map{width:max-content;min-width:100%}
#map svg{display:block;width:var(--mw,100%);height:var(--mh,100%)}
#map text{font-size:8.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
#map [data-r]{cursor:pointer}
#map .city{pointer-events:none}
#map.st .city{pointer-events:auto;cursor:pointer}
#map.st .city.pick circle+circle{stroke:var(--accent);stroke-width:2.4}
.flash line{animation:fl 1.2s ease-out 2}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flash line{animation:none}}
.tray{flex:none;display:grid;gap:6px;padding:7px 8px 8px;border-top:1px solid var(--line)}
#market{flex-wrap:nowrap;gap:5px}
#market .card{flex:1;width:auto;height:36px}
.lbl{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{width:50px;height:36px;border-radius:6px;border:1.5px solid rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font:700 13px/1 inherit;cursor:pointer;padding:0}
.card:disabled{opacity:.45;cursor:default}
.deck{background:var(--head);color:#f1e6cf;border-style:dashed;border-color:#f1e6cf}
.loco{background:linear-gradient(135deg,#e53935,#fb8c00,#f6c90e,#43a047,#1e88e5,#9c27b0)!important;color:#fff!important;text-shadow:0 1px 2px #000}
.hand{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.hand .chip{height:28px;font-size:13px}
.chip{height:34px;border-radius:5px;border:1.5px solid rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.chip.z{opacity:.22}
.bar{display:flex;gap:5px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 12px;font:700 14px/1.1 inherit;cursor:pointer}
.bar .btn{flex:1;padding:8px 4px;font-size:13px}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.wide{display:block;width:100%;margin-top:8px}
.btn:focus-visible,.card:focus-visible,.lnk:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--panel);border-radius:14px 14px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease-out}
#sheet.open{transform:translate(var(--dx,0px),var(--dy,0px))}
#sheet.drag{transition:none}
#scrim.clear{background:transparent}
#scrim.see{background:transparent;pointer-events:none}
.grip{position:sticky;top:-14px;margin:-14px -16px 4px;height:28px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;background:var(--panel);z-index:1;border-radius:14px 14px 0 0}
.grip span{width:46px;height:5px;border-radius:3px;background:var(--muted);opacity:.6}
#sheet.drag .grip{cursor:grabbing}
#sheet p{margin:6px 0}
#sheet .x{float:right;width:36px;height:36px;margin:-4px -6px 4px 8px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px/1 inherit;cursor:pointer}
.opt{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;text-align:left}
.sw{display:inline-block;vertical-align:-3px;width:22px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.3);flex:none}
.tk{display:flex;justify-content:space-between;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.tk.on{border-color:var(--accent);background:var(--panel)}
.tk.ok{border-color:#3f8f55}
.tk b{font-family:"Zilla Slab",Georgia,serif;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
td,th{padding:5px 3px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
.card.pick{opacity:1!important;outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-4px);transition:transform .2s}
.now{border-left:5px solid;padding:7px 10px;background:var(--panel);border-radius:6px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.now .lnk{margin-left:auto;font-size:12.5px}
.final{background:var(--accent);color:#fff;font-weight:700;padding:7px 10px;border-radius:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:90%}
#toast.open{opacity:1}
#tutBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:59;display:none}
#tutBg.open{display:block}
.focus{position:relative;z-index:60;box-shadow:0 0 0 3px var(--accent),0 0 0 100vmax rgba(0,0,0,.55)!important}
#tut{position:fixed;left:10px;right:10px;max-width:540px;margin:0 auto;z-index:70;background:var(--panel);border-radius:12px;padding:14px 16px;display:none;box-shadow:0 6px 30px rgba(0,0,0,.35)}
#tut.open{display:block}
#tut.top{top:calc(12px + env(safe-area-inset-top,0px))}
#tut.bot{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#tut p{margin:4px 0 12px}
#start{position:fixed;inset:0;z-index:80;background:var(--head);color:#f1e6cf;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
#start .box{max-width:380px;width:100%}
#start h1{font-size:40px;line-height:1.05;margin-bottom:10px}
#start p{color:#cdd8d2;margin:0 0 22px}
#start .lbl{color:#cdd8d2}
#start .btn{background:transparent;color:#f1e6cf;border-color:rgba(241,230,207,.45)}
#start .btn.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
#start .btn.pri{background:var(--accent);color:#fff;border-color:transparent}
#opp .btn{width:56px}
.rail{height:6px;margin:18px 0;background:repeating-linear-gradient(90deg,#f1e6cf 0 18px,transparent 18px 26px);opacity:.6;border-radius:3px}
.menu .btn{display:block;width:100%;margin-top:8px;text-align:left}
.tray .lbl{margin:0}
#tixPanel{display:none;min-height:0;overflow:auto;padding:2px 8px 10px}
#tixPanel .lbl{margin:2px 0 0}
#tixPanel .tk{padding:8px 10px;margin-top:5px}
#tixPanel .tk b{font-size:15px}
/* Sideways phone, tablet or desktop: the map fills the left, everything else sits in a side panel */
@media (orientation:landscape){
 :root{--side:clamp(272px,30vw,380px)}
 #app{display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"map top" "map tick" "map tray" "map tix"}
 #mapWrap{grid-area:map}
 .top{grid-area:top;align-items:flex-start}
 .players{flex-wrap:wrap}
 #ticker{grid-area:tick}
 .tray{grid-area:tray;border-top:0;border-left:1px solid var(--line)}
 #tixPanel{grid-area:tix;display:block;border-left:1px solid var(--line)}
 #sheet{left:auto;right:0;margin:0;width:min(430px,100%);max-width:none;max-height:100%;border-radius:14px 0 0 0}
 #toast{left:calc((100% - var(--side))/2)}
}
</style>
</head>
<body>
<div id="app">
<div class="top"><button class="ib" id="menuBtn" aria-label="Menu">☰</button><div class="players" id="players"></div></div>
<div id="mapWrap"><div id="map"></div></div>
<div id="ticker" role="status" aria-live="polite" title="Tap for the game log"></div>
<div class="tray">
<div class="row" id="market" role="group" aria-label="Face-up cards and the deck"></div>
<div class="hand" id="hand" role="group" aria-label="Your hand"></div>
<div class="bar"><button class="btn" id="tixBtn">Tickets</button><button class="btn" id="stBtn">Station</button><button class="btn" id="hintBtn">Hint</button><button class="btn" id="zoomBtn">Zoom</button></div>
</div>
<div id="tixPanel"><div class="lbl">Your tickets</div><div id="tixList"></div></div>
</div>
<div id="scrim"></div><div id="sheet"></div><div id="toast"></div>
<div id="tutBg"></div><div id="tut"></div>
<div id="start"><div class="box">
<h1>Continental Rails</h1>
<p>Lay track across Europe against computer rivals. Claim routes, connect your secret destinations, and beat the other railways to the best lines.</p>
<div class="lbl">Opponents</div>
<div class="row" id="opp"><button class="btn" data-n="1">1</button><button class="btn on" data-n="2">2</button><button class="btn" data-n="3">3</button></div>
<div class="rail"></div>
<button class="btn pri wide" id="playT">Play with tutorial</button>
<button class="btn wide" id="play">Play</button>
</div></div>

function botTickets(pi,list,min){const p=G.players[pi];const sc=list.map(t=>{const pa=path(pi,t.a,t.b);return{t,c:pa?cost(pa):999}}).sort((a,b)=>a.c-b.c);

// whole: all of it fits; close: twice fill. MS = screen pixels per map unit.
let ZM=null,MS=1;try{ZM=localStorage.getItem('cr-zoom')}catch(e){}
function sizeMap(){const w=$('mapWrap'),W=w.clientWidth,H=w.clientHeight;if(!W||!H)return;const a=W/428,b=H/404;let mw=W,mh=H;
 if(ZM==='whole')MS=Math.min(a,b);else{MS=Math.max(a,b)*(ZM==='close'?2:1);mw=428*MS;mh=404*MS}
 w.style.setProperty('--mw',mw+'px');w.style.setProperty('--mh',mh+'px')}
function centerMap(){const w=$('mapWrap');w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;w.scrollTop=(w.scrollHeight-w.clientHeight)/2}
function setZoom(z){ZM=z;try{localStorage.setItem('cr-zoom',z)}catch(e){}sizeMap();requestAnimationFrame(centerMap);if(G)render()}
// Scroll so the given cities are in view (above the pop-up window when it covers the map).
function focusCities(ns){if(!ns||ZM==='whole')return;const w=$('mapWrap'),r=w.getBoundingClientRect(),xs=ns.map(n=>CITIES[n][0]),ys=ns.map(n=>CITIES[n][1]);
 const sh=$('sheet'),top=sh.classList.contains('open')?sh.getBoundingClientRect().top:r.bottom,visH=Math.max(120,Math.min(r.bottom,top)-r.top);
 const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
 w.scrollTo({left:(cx+14)*MS-w.clientWidth/2,top:(cy+8)*MS-visH/2,behavior:'smooth'})}
function chooseTickets(list,min,done){const pick=new Set(list.map((_,i)=>i));
 const draw=()=>sheet(`<h3>Choose destination tickets</h3><p class="muted">Keep at least ${min}. Link both cities to earn the points; unfinished ones count against you. Tap a ticket to find it on the map.</p>${list.map((t,i)=>`<button class="tk${pick.has(i)?' on':''}" data-a="t" data-i="${i}"><span>${pick.has(i)?'☑':'☐'} ${t.a} → ${t.b}</span><b>${t.v}</b></button>`).join('')}<button class="btn pri wide" data-a="ok" ${pick.size<min?'disabled':''}>Keep ${pick.size} ticket${pick.size===1?'':'s'}</button>`,
  (a,el)=>{if(a==='t'){const i=+el.dataset.i;pick.has(i)?pick.delete(i):pick.add(i);G.hl=[list[i].a,list[i].b];render();draw();focusCities(G.hl)}
   else if(a==='ok'&&pick.size>=min){closeSheet();const keep=list.filter((_,i)=>pick.has(i));me().tickets.push(...keep);G.tdeck.push(...list.filter((_,i)=>!pick.has(i)));G.hl=null;done(keep)}},null,true,true);draw()}
function askStart(){G.busy=true;render();chooseTickets(me().start,2,()=>{G.busy=false;log('You kept your tickets. Your move!');render()})}
function showStart(){closeTut();$('start').style.display='flex'}
function begin(t){$('start').style.display='none';newGame(NB);ticker.html=null;setZoom(ZM||(innerWidth>=1000&&innerHeight>=700?'whole':'fill'));if(ZM!=='whole'&&!t)setTimeout(()=>toast('Drag the map to see all of Europe.'),1200);if(t)tutorial(askStart);else askStart()}

function onRoute(id){const r=G.routes[id],p=me();G.sel=id;render();
 let h=`<h3>${r.a} – ${r.b}</h3><p class="muted">${r.len} × ${r.c==='X'?'any one colour':NAME[r.c]}, worth ${PTS[r.len]} point${PTS[r.len]>1?'s':''}.${r.t?' Tunnel.':''}${r.f?` Ferry: needs ${r.f} Loco${r.f>1?'s':''}.`:''}</p>`;
 if(r.owner>=0)h+=`<p>Already claimed by ${r.owner?G.players[r.owner].name:'you'}.</p>`;
 else if(!myTurn())h+='<p>Wait for your turn.</p>';
 else if(G.draws)h+='<p>Take your second card first.</p>';
 else if(p.trains<r.len)h+=`<p>You only have ${p.trains} trains left.</p>`;
 else{const o=payOpts(p,r);h+=o.length?o.map(c=>`<button class="btn opt" data-a="pay" data-c="${c}">${swatch(c)} Pay ${payLabel(p,r,c)}</button>`).join(''):'<p>You can’t afford this route yet. Draw more matching cards.</p>';
  if(r.t&&o.length)h+='<p class="muted small">After you pay, 3 cards are revealed. Each one matching your colour (or a Loco) costs one more card. You can back out, but your turn ends.</p>'}
 sheet(h,(a,el)=>{if(a==='pay')humanClaim(r,el.dataset.c)},()=>{G.sel=-1;render()})}
function humanClaim(r,c){closeSheet();const p=me();G.didAct=true;
 if(!r.t){claim(0,r,c,r.len);return endTurn()}
 const{cards,extra}=reveal(c),ok=canSpend(p,c,r.len+extra,r.f);
 sheet(`<h3>Tunnel ${r.a} – ${r.b}</h3><p class="muted">Revealed from the deck:</p><div class="row">${cards.map(x=>cardEl(x,'disabled style="opacity:1"')).join('')}</div><p>${extra?`You need ${extra} more ${c==='L'?'Loco':NAME[c]+' or Loco'} card${extra>1?'s':''}.`:'No extra cards needed.'}</p>${ok?`<button class="btn pri wide" data-a="go">${extra?'Pay the extra and build':'Build it'}</button>`:'<p>You can’t cover the extra cost.</p>'}<button class="btn wide" data-a="no">Back out (ends your turn)</button>`,
  a=>{closeSheet();if(a==='go'&&ok)claim(0,r,c,r.len+extra);else log('You backed out of a tunnel.');endTurn()},null,true)}
function onCity(n){if(G.players.some(p=>p.stations.includes(n)))return toast('That city already has a station.');
 const p=me(),k=p.stations.length+1,o=CC.filter(c=>p.hand[c]>0&&canSpend(p,c,k));if(p.hand.L>=k)o.push('L');
 sheet(`<h3>Station in ${n}</h3><p class="muted">Costs ${k} card${k>1?'s':''} of one colour. Locos are wild.</p>${o.length?o.map(c=>`<button class="btn opt" data-a="b" data-c="${c}">${swatch(c)} Pay ${c==='L'?k+' Loco'+(k>1?'s':''):(()=>{const l=Math.max(0,k-p.hand[c]);return`${k-l} ${NAME[c]}${l?` + ${l} Loco`:''}`})()}</button>`).join(''):'<p>You don’t have enough matching cards.</p>'}`,
  (a,el)=>{closeSheet();spend(p,el.dataset.c,k);p.stations.push(n);G.didAct=true;log(`You built a station in ${n}.`);endTurn()})}
function showTickets(){const p=me(),can=myTurn()&&!G.draws&&!G.mode&&G.tdeck.length;
 sheet(`<h3>Your tickets</h3>${p.tickets.map(t=>{const ok=conn(0,t.a,t.b),on=G.hl&&G.hl[0]===t.a&&G.hl[1]===t.b;return`<button class="tk${ok?' ok':''}${on?' on':''}" data-a="hl" data-x="${t.a}|${t.b}"><span>${ok?'✓ ':''}${t.a} → ${t.b}</span><b>${t.v}</b></button>`}).join('')||'<p>No tickets yet.</p>'}<p class="muted small">Tap a ticket to mark its cities on the map. Stations only count at the end.</p>${can?'<button class="btn pri wide" data-a="draw">Draw 3 new tickets (uses your turn)</button>':''}`,
  (a,el)=>{if(a==='hl'){const x=el.dataset.x.split('|');G.hl=G.hl&&G.hl[0]===x[0]&&G.hl[1]===x[1]?null:x;closeSheet();render();focusCities(G.hl)}
   else if(a==='draw'){closeSheet();chooseTickets(G.tdeck.splice(0,3),1,k=>{G.didAct=true;log(`You kept ${k.length} new ticket${k.length>1?'s':''}.`);endTurn()})}})}

function showHint(){if(!G||G.busy||G.over)return;const p=me(),need=[],bad=[];
 for(const t of p.tickets){if(conn(0,t.a,t.b))continue;const pa=path(0,t.a,t.b);if(!pa){bad.push(t);continue}for(const r of pa)if(!need.includes(r))need.push(r)}
 G.hint=need.map(r=>r.id);render();
 const can=r=>payOpts(p,r).length>0,rs=need.slice().sort((a,b)=>can(b)-can(a)||b.len-a.len),now=rs.filter(can);
 const cols=[...new Set(rs.filter(r=>!can(r)).map(r=>r.c==='X'?'any one colour (for grey routes)':NAME[r.c]))];
 let h='<h3>Hint</h3>';
 if(!rs.length&&!bad.length)h+='<p>All your tickets are complete! Take new tickets with the Tickets button, or build long routes for extra points.</p>';
 else{if(rs.length)h+=`<p class="muted">These routes complete your tickets. They now glow on the map. Tap one to build it.</p>${rs.map(r=>`<button class="tk" data-a="r" data-i="${r.id}"><span>${swatch(r.c)} ${r.a} – ${r.b}</span><span>${r.len} ${r.c==='X'?'any':NAME[r.c]}${can(r)?' ✓':''}</span></button>`).join('')}`;
  h+=`<p><b>What to do now:</b> ${now.length&&myTurn()&&!G.draws?`build a route marked ✓, for example ${now[0].a} – ${now[0].b}.`:cols.length?`collect ${cols.join(', ')} cards, or rainbow Locos.`:'wait for your turn.'}</p>`;
  if(bad.length)h+=`<p class="small">Blocked: ${bad.map(t=>t.a+' → '+t.b).join(', ')}. A station in a city next to the blocking route can rescue it.</p>`}
 sheet(h,(a,el)=>{if(a==='r'){closeSheet();onRoute(+el.dataset.i)}})}
let TI=0,TDONE=null;
function closeTut(){document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));$('tut').className='';$('tutBg').classList.remove('open')}
function tutorial(done){TI=0;TDONE=done||null;showTut()}
function showTut(){document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));const[id,t,b]=TUT[TI],el=id&&$(id);
 $('tutBg').classList.toggle('open',!el);if(el){el.classList.add('focus');el.scrollIntoView({block:'nearest'})}
 const low=el&&el.getBoundingClientRect().top>innerHeight*.4;$('tut').className='open '+(low?'top':'bot');
 $('tut').innerHTML=`<div class="muted small">${TI+1} of ${TUT.length}</div><h3>${t}</h3><p>${b}</p><div class="row"><button class="btn" data-t="skip">Skip</button><span class="sp"></span>${TI?'<button class="btn" data-t="back">Back</button>':''}<button class="btn pri" data-t="next">${TI===TUT.length-1?'Start playing':'Next'}</button></div>`}

if(!AUTO){
 $('opp').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;NB=+b.dataset.n;for(const x of $('opp').children)x.classList.toggle('on',x===b)};
 $('play').onclick=()=>begin(false);$('playT').onclick=()=>begin(true);
 $('tut').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const a=b.dataset.t;
  if(a==='back'){TI--;return showTut()}if(a==='next'&&TI<TUT.length-1){TI++;return showTut()}closeTut();const d=TDONE;TDONE=null;if(d)d()};
 const canFs=!!document.documentElement.requestFullscreen&&!matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
 const fullScreen=()=>{const d=document;if(d.fullscreenElement)return d.exitFullscreen();d.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>toast('Full screen isn’t available here. Try the downloaded file.'))};
 const showLog=()=>{if(G)sheet(`<h3>Game log</h3>${G.log.map(l=>`<p class="small">${l}</p>`).join('')}`)};
 $('menuBtn').onclick=()=>sheet(`<h3>Continental Rails</h3><div class="menu"><button class="btn" data-a="help">How to play</button><button class="btn" data-a="log">Game log</button>${canFs?'<button class="btn" data-a="fs">Full screen</button>':''}<button class="btn" data-a="new">New game</button></div>`,a=>{closeSheet();
  if(a==='help'){if(G)tutorial(null)}else if(a==='log')showLog();else if(a==='fs')fullScreen();else if(a==='new'){if(!G||G.over||confirm('Start a new game?'))showStart()}});
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 $('sheet').onclick=e=>{if(e.target.closest('[data-close]'))return closeSheet();const b=e.target.closest('[data-a]');if(b&&SH&&SH.onAct&&!b.disabled)SH.onAct(b.dataset.a,b)};
 $('scrim').onclick=()=>{if(SH&&!SH.lock)closeSheet()};
 {let d=null;const s=$('sheet');
  s.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-grip]'))return;d={x:e.clientX,y:e.clientY,dx:SDX,dy:SDY,r:s.getBoundingClientRect()};s.classList.add('drag');s.setPointerCapture(e.pointerId);e.preventDefault()});
  s.addEventListener('pointermove',e=>{if(!d)return;const r=d.r,mx=Math.max(80-r.right,Math.min(innerWidth-80-r.left,e.clientX-d.x)),my=Math.max(-r.top,Math.min(innerHeight-40-r.top,e.clientY-d.y));SDX=d.dx+mx;SDY=d.dy+my;placeSheet()});
  const up=()=>{if(d){d=null;s.classList.remove('drag')}};s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up)}
 $('map').onclick=e=>{if(!G||(SH&&SH.lock))return;const c=e.target.closest('[data-c]');if(c&&G.mode==='station'&&myTurn())return onCity(c.dataset.c);const r=e.target.closest('[data-r]');if(r&&G.mode!=='station')onRoute(+r.dataset.r)};
 $('market').onclick=e=>{const b=e.target.closest('[data-f]');if(!b||b.disabled||!myTurn())return;let c;
  if(b.dataset.f==='d'){c=takeDeck(0);if(!c)return;toast(`You drew ${NAME[c]}.`)}else{const i=+b.dataset.f;if(G.face[i]==='L'&&G.draws)return;c=takeFace(0,i)}
  G.draws++;G.didAct=true;
  if((b.dataset.f!=='d'&&c==='L')||G.draws>=2||!(G.deck.length+G.disc.length||G.face.some(x=>x!=='L'))){log(`You took ${G.draws} card${G.draws>1?'s':''}.`);endTurn()}else render()};
 $('ticker').onclick=e=>{if(!G)return;if(e.target.closest('[data-a="cancelSt"]')){G.mode=null;return render()}if(e.target.closest('[data-a="fast"]')){FAST=!FAST;return render()}showLog()};
 $('tixList').onclick=e=>{const b=e.target.closest('[data-x]');if(!b||!G)return;const x=b.dataset.x.split('|');G.hl=G.hl&&G.hl[0]===x[0]&&G.hl[1]===x[1]?null:x;render();focusCities(G.hl)};
 if(window.ResizeObserver)new ResizeObserver(()=>{if(G){sizeMap();centerMap()}}).observe($('mapWrap'));
 $('tixBtn').onclick=()=>{if(G&&!G.busy)showTickets()};
 $('hintBtn').onclick=showHint;
 $('stBtn').onclick=()=>{if(!myTurn())return;G.mode=G.mode==='station'?null:'station';render()};
 $('zoomBtn').onclick=()=>setZoom(ZM==='fill'?'whole':ZM==='whole'?'close':'fill');
}else newGame(window.__NB||2);
</script>
</body>
</html>
